# Заменяет локальную сборку готовыми образами из GitHub Container Registry.
services:
  backend:
    image: ghcr.io/avin/book-hub-backend:${BOOK_HUB_IMAGE_TAG:?BOOK_HUB_IMAGE_TAG is required}
    build: !reset null

  frontend:
    image: ghcr.io/avin/book-hub-frontend:${BOOK_HUB_IMAGE_TAG:?BOOK_HUB_IMAGE_TAG is required}
    build: !reset null

  migrate:
    image: ghcr.io/avin/book-hub-backend:${BOOK_HUB_IMAGE_TAG:?BOOK_HUB_IMAGE_TAG is required}
    build: !reset null

  admin:
    image: ghcr.io/avin/book-hub-backend:${BOOK_HUB_IMAGE_TAG:?BOOK_HUB_IMAGE_TAG is required}
    build: !reset null

  backup:
    image: ghcr.io/avin/book-hub-backend:${BOOK_HUB_IMAGE_TAG:?BOOK_HUB_IMAGE_TAG is required}
    build: !reset null
