<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Hub</title>
    <script>
      // Apply the active theme before first paint to avoid a flash of the
      // wrong theme (FOUC). Runs synchronously in <head>. Mirrors the logic in
      // src/styles/themes.ts; kept inline and dependency-free on purpose.
      // ADR: docs/adr/0001-theme-system.md
      (function () {
        try {
          var raw = localStorage.getItem('book-hub-preferences');
          var theme = raw ? JSON.parse(raw).theme || null : null;
          var known = [
            'light-clay',
            'light-slate',
            'light-sage',
            'light-peach',
            'light-sand',
            'light-mint',
            'dark-ink',
            'dark-green',
            'dark-graphite',
            'dark-ocean',
            'dark-amethyst',
          ];
          if (!theme || known.indexOf(theme) === -1) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark-ink'
              : 'light-clay';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light-clay');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
