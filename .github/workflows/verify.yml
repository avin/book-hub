name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and storage contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: book_hub_test
          POSTGRES_USER: book_hub
          POSTGRES_PASSWORD: book_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U book_hub -d book_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        run: make backend-test

      - name: Run PostgreSQL storage contract suite
        env:
          BOOK_HUB_TEST_DATABASE_URL: postgresql://book_hub:book_hub@localhost:5432/book_hub_test?sslmode=disable
        run: make storage-contract-test

      - name: Build all backend commands without CGO
        env:
          CGO_ENABLED: "0"
        run: |
          for command in book-hub-server book-hub-admin book-hub-migrate book-hub-backup; do
            go -C backend build -o "$RUNNER_TEMP/$command" "./cmd/$command"
          done

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t book-hub-backend:verify .

      - name: Run backup compatibility tests with the bundled PostgreSQL client
        env:
          CGO_ENABLED: "0"
          BOOK_HUB_TEST_DATABASE_URL: postgresql://book_hub:book_hub@localhost:5432/book_hub_test?sslmode=disable
        run: |
          go -C backend test -c -o "$RUNNER_TEMP/backup.test" ./internal/backup
          docker run --rm --network host -e BOOK_HUB_TEST_DATABASE_URL -v "$RUNNER_TEMP/backup.test:/tmp/backup.test:ro" --entrypoint /tmp/backup.test book-hub-backend:verify -test.v

      - name: Validate PostgreSQL and SQLite Compose stacks
        run: |
          temp=$(mktemp -d)
          cp docker-compose*.yml "$temp/"
          cp .env.example "$temp/.env"
          docker compose --project-directory "$temp" -f "$temp/docker-compose.yml" config --quiet
          BOOK_HUB_IMAGE_TAG=verify docker compose --project-directory "$temp" -f "$temp/docker-compose.yml" -f "$temp/docker-compose.ghcr.yml" config --quiet
          printf '%s\n' 'BOOK_HUB_DATABASE_URL=sqlite:///data/db/book-hub.sqlite' 'BOOK_HUB_STORAGE_DIR=/data/books' 'BOOK_HUB_SESSION_SECRET=ci-only-session-secret' > "$temp/.env"
          docker compose --project-directory "$temp" -f "$temp/docker-compose.sqlite.yml" config --quiet
          BOOK_HUB_IMAGE_TAG=verify docker compose --project-directory "$temp" -f "$temp/docker-compose.sqlite.yml" -f "$temp/docker-compose.ghcr.yml" config --quiet
          rm -rf "$temp"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Run frontend unit tests
        run: make frontend-unit-test

      - name: Type-check frontend
        run: npm --prefix frontend run typecheck

      - name: Build frontend
        run: make frontend-build

      - name: Install Playwright browser
        run: npm --prefix frontend exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: make frontend-e2e-test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  generated-api:
    name: Generated API types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Regenerate API types
        run: make frontend-generate

      - name: Verify generated API types are committed
        run: git diff --exit-code
